[project]
name = "common-ground"
version = "0.1.0"
description = "Closed-loop conversational repair coaching for Ray-Ban Meta glasses (Meta Muse hackathon)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "huggingface_hub>=0.24",
  "soundfile>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
audio = ["torch>=2.3", "transformers>=4.44", "librosa>=0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common_ground*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
